<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <style>

/* General Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body Styling */
body {
    font-family: Arial, sans-serif;
    background-color: #ffcccb; /* Pink background */
    color: #333;
}

/* Header Styling */
header {
    background-color: #ff66b2; /* A pink shade for the header */
    color: white;
    padding: 20px 0;
}

header h1 {
    text-align: center;
    font-size: 2em;
}

header nav ul {
    list-style: none;
    text-align: center;
}

header nav ul li {
    display: inline;
    margin: 0 15px;
}

header nav ul li a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

header nav ul li a:hover {
    color: #ccc;
}

/* Main Content */
main {
    margin: 20px;
}

h2, h3 {
    color: #f1e8e8;
}

/* Section Styles */
#intro, #key-terms, #table-of-contents {
    margin-top: 20px;
    padding: 20px;
    background-color: #ffe6f0; /* Light pink background for sections */
    border-radius: 8px;
}

/* Add pancake image to the intro section */
#intro {
    background-image: URL('https://japantoday-asset.scdn3.secure.raxcdn.com/img/store/cb/7e/cb6cfa5bb4fca685ac019828092fba1f75ba/cp-9/_w1700.png'); /* Replace with a real pancake image URL */
    background-size: cover;
    background-position: center;
    text-align: center;
    text-shadow: -1px -1px 0 #bb4870, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    color: rgb(251, 251, 251);
    padding: 100px 20px;
}

#intro h2 {
    font-size: 2em;
}

/* Footer Styling */
footer {
    background-color: #ff66b2;
    color: white;
    text-align: center;
    padding: 10px 0;
}

/* Hover effect */
a:hover {
    color: #007BFF;
}

    </style>
</head>
<body>
    <header>
        <h1>Website Title</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="references.html">References</a></li>
                <li><a href="quiz.html">quiz</a></li>
            </ul>

    </header>

    <main>
        <section id="topic-details">
            <h2>Topic 1</h2>

            <p>Explanation of subsection 1.1.</p>
            <h3>Subsection 1.2</h3>
            <p>Explanation of subsection 1.2.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Your Website Name</p>
    </footer>
</body>
